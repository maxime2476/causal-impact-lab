name: benchmark

# Scheduled estimator benchmark on a fixed synthetic snapshot (no network / real
# data) to catch numerical and performance regressions: the headline panel-LP
# estimators are run and their key outputs compared against a committed baseline
# (benchmarks/baseline.json). Numerical drift fails the job; per-estimator
# timings are printed for tracking.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync environment (locked)
        run: uv sync --all-extras --frozen

      - name: Estimator benchmark (numerical + performance)
        run: uv run python -m cil.benchmark

      - name: Test suite (timings)
        run: uv run pytest --durations=25
