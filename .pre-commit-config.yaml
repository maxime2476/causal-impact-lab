# Pre-commit gates mirror CI plus the attribution-policy scanner.
default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      # Strict type checking against the project environment.
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      # Attribution policy: scan staged file contents.
      - id: provenance-files
        name: attribution scan (files)
        entry: python scripts/check_provenance.py
        language: system
        stages: [pre-commit]
        exclude: '^uv\.lock$'

      # Attribution policy: scan the commit message.
      - id: provenance-commit-msg
        name: attribution scan (commit message)
        entry: python scripts/check_provenance.py
        language: system
        stages: [commit-msg]
