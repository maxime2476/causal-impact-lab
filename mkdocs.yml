site_name: Causal Impact Lab
site_description: >-
  Causal effect of contractionary US monetary policy shocks on US employment.
repo_url: https://github.com/maxime2476/causal-impact-lab
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Environment: environment.md
  - Data: data.md
  - Methods: methods.md
  - Analysis plan: analysis_plan.md
  - Results: results.md
  - Paper: paper.md
